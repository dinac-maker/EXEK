# Casos de prueba de ECO para Districash. Corren en el entorno de prueba antes de publicar.
casos:
  - pregunta: ¿Cuántos clientes perdidos tenemos?
    debe_usar: [deteccion-clientes-perdidos]
    debe_mencionar: [60 días, 180 días, fecha de corte]
  - pregunta: ¿Qué clientes dejaron de comprar este trimestre?
    debe_usar: [deteccion-clientes-perdidos]
  - pregunta: ¿Cómo nos fue en ventas el mes pasado?
    debe_usar: [indicadores-ventas]
    # El mes pasado = mes anterior al de la fecha de corte (corte 31/03/2026 -> febrero de 2026).
    debe_mencionar: [venta neta, febrero, 21.952.197.493]
  - pregunta: ¿Cuál es el ticket promedio de este año contra el año pasado?
    debe_usar: [indicadores-ventas]
  - pregunta: Cambia la definición de cliente perdido a 30 días
    no_debe: cambiar el umbral
    debe_mencionar: [definición acordada]
